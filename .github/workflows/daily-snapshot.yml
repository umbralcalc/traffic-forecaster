name: daily-snapshot

# Bank one immutable daily snapshot of the TfL road disruption feed. The feed is
# active-only with no creation timestamp, so this archive can only be built going
# forward — a missed day is unrecoverable.
on:
  schedule:
    # 06:23 UTC daily. Disruptions evolve slowly; one pull a day is enough.
    # Deliberately off the top of the hour: GitHub heavily delays/drops
    # scheduled runs at :00 of popular hours.
    - cron: "23 6 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: daily-snapshot
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - name: Pull snapshot
        env:
          # Optional: set this repo secret to raise the TfL rate limit. The pull
          # works keyless, but an authenticated pull is more robust.
          TFL_APP_KEY: ${{ secrets.TFL_APP_KEY }}
        run: go run ./cmd/pull-disruptions

      - name: Commit snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Stage first, then check the staged diff: `git diff --quiet` ignores
          # untracked files, so a brand-new day's snapshot would otherwise be
          # seen as "no change" and silently dropped.
          git add data/raw
          if git diff --cached --quiet; then
            echo "no new snapshot to commit"
            exit 0
          fi
          git commit -m "data: daily disruption snapshot $(date -u +%Y-%m-%d)"
          git push
