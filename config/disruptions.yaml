# traffic-forecaster — resolution criterion (the frozen contract)
#
# This file is the single source of truth for WHAT we forecast and HOW it is
# scored. It is committed alongside predictions so the rules are provable to have
# pre-dated the outcome. Numbers marked "provisional" may be tuned ONLY before the
# first published prediction; afterwards they freeze — changing them corrupts the
# back-history.
#
# Production target settled 2026-06-09: monthly ROADWORKS-disruption burden per
# adaptive-resolution London unit, from DfT Street Manager. (Non-works incidents —
# accidents, congestion — are a future v2 term from the TfL feed, which we keep
# banking as daily snapshots; see PLAN.md and SOURCES.md.)

version: 2
status: draft # draft until the first published month, then frozen

# ---------------------------------------------------------------------------
# TARGET — the scored quantity
# ---------------------------------------------------------------------------
target:
  name: roadworks_disruption_burden
  description: >
    Traffic-management-weighted roadworks work-days per spatial unit per calendar
    month (planned + emergency street works). This is ROADWORKS disruption, named
    precisely — not all road disruption.
  source: dft_street_manager # London permits; cited in SOURCES.md, never committed

  # Burden(unit, month) = sum over works active in the month of
  #   traffic_management_weight(work) * days-the-work-is-active-within-the-month.
  # Realised from each work's actual (else proposed) window; see internal/burden.
  metric: tm_weighted_work_days

  # Provisional traffic-management weights (kept in sync with burden.TMWeight).
  traffic_management_weights:
    "Road closure": 1.0
    "Contra-flow": 0.8
    "Lane closure": 0.6
    "Multi-way signals": 0.6
    "Two-way signals": 0.3
    "Give and take": 0.3
    "Priority working": 0.3
    "Stop/go boards": 0.3
    "Convoy workings": 0.3
    "Some carriageway incursion": 0.2
    "Temp obstruction 15 minute delay": 0.2
    "No carriageway incursion": 0.05
    _default: 0.3
  emergency_categories_prefix: "Immediate" # splits emergency vs planned works

  # ADAPTIVE spatial resolution: the busiest cells stay fine; the sparse remainder
  # folds up to borough level so every unit has enough events to calibrate.
  granularity:
    scheme: adaptive_hybrid
    cell_km: 2 # square British National Grid cells
    dense_top_n: 150 # busiest N cells (by realised activity) kept as fine cells
    rest_unit_suffix: " ·rest" # the rest of a borough pooled into one unit
    # => ~183 units (150 fine cells + 33 borough-rests). A fine cell is assigned
    # to its modal borough (boundary cells -> dominant borough; an approximation).

# ---------------------------------------------------------------------------
# MODEL — the predictive distribution (backtested offline on 6y of history)
# ---------------------------------------------------------------------------
model:
  name: hier_spatial # internal/burdenmodel.SpatialFactorModel on hybrid units
  description: >
    A shared London common factor couples all units; a nearest-neighbour spatial
    autoregression couples adjacent fine cells; the vintaged forward permit
    pipeline is the central covariate. Emits a predictive ENSEMBLE per unit.
  pipeline_covariate: true # forward permit book, vintaged by each work's filing
  residual_window_months: 18 # trailing window (trend-aware) for calibration
  ensemble_size: 200

# ---------------------------------------------------------------------------
# RESOLUTION — how the target is settled
# ---------------------------------------------------------------------------
resolution:
  source: dft_street_manager_monthly_archive
  # A month's archive is published with ~1-month lag; resolve from the SETTLED
  # archive (target month + a settle buffer) so late-entered/altered permits and
  # actual start/stop events are in. Decide once; never change.
  settle_buffer_days: 45
  void_rule: void a unit-month if its monthly archive is missing or truncated

# ---------------------------------------------------------------------------
# SCORING
# ---------------------------------------------------------------------------
scoring:
  primary:
    target: per_unit_burden
    rule: CRPS
    aggregate: mean_over_unit_months
  joint:
    target: london_total_burden # sum over units; rewards correct co-movement
    rule: CRPS
  calibration:
    method: PIT_histogram # across all resolved unit-months to date

# ---------------------------------------------------------------------------
# OPEN ITEMS to settle before freezing (status: draft)
# ---------------------------------------------------------------------------
open_items:
  - Calibrate traffic_management_weights (currently provisional).
  - dense_top_n=150 chosen from the detail-vs-calibration sweep (knee at ~150);
    confirm before first publication.
  - Boundary fine cells are assigned to their modal borough — revisit if material.
  - v2: add the non-works incident term (accidents/congestion) from the TfL feed
    once enough daily snapshots have accrued; reconcile borough naming then.
